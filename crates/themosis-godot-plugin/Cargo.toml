[package]
name = "themosis-godot-plugin"
description = "Godot GDExtension and native resource integration for Themosis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Native probe classes driving the Godot-backed test suites. Never enable in a
# distributed build: `just package-plugin` builds with default features only.
test-support = []

[dependencies]
themosis.workspace = true
themosis-core.workspace = true
themosis-godot.workspace = true
themosis-kdl.workspace = true

godot.workspace = true
thiserror.workspace = true

tempfile.workspace = true

[lints]
workspace = true
