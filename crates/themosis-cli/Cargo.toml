[package]
name = "themosis-cli"
description = "Command-line validation for Themosis theme sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "themosis"
path = "src/main.rs"

[features]
default = ["godot"]
godot = [
    "dep:tempfile",
    "dep:themosis-godot",
]

[dependencies]
themosis.workspace = true
themosis-core.workspace = true
themosis-godot = { workspace = true, optional = true }

clap = { version = "4.6", features = ["derive"] }
tempfile = { workspace = true, optional = true }

[lints]
workspace = true
