name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
      - name: Package host Godot addon
        run: ./scripts/package-plugin.sh

  godot-runtime:
    name: Godot integration against ${{ matrix.godot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot:
          - 4.5-stable
          - 4.6-stable
          - 4.7-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Download Godot
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}/Godot_v${{ matrix.godot }}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${{ matrix.godot }}_linux.x86_64"
      - name: Test runtime-backed CLI and plugin
        env:
          THEMOSIS_GODOT_BINARY: /tmp/godot/Godot_v${{ matrix.godot }}_linux.x86_64
        run: |
          cargo test -p themosis-cli --test check
          cargo test -p themosis-godot-plugin --test headless
